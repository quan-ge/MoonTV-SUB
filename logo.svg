<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 赛博紫到霓虹青的渐变 -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" /> <!-- 霓虹青 -->
      <stop offset="100%" stop-color="#7c4dff" /> <!-- 赛博紫 -->
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 深空背景 (圆角矩形) -->
  <rect width="512" height="512" rx="100" fill="#121212" />

  <!-- 主体图形区 -->
  <g filter="url(#glow)">
    <!-- 月亮轮廓 (用三个圆叠加切出月牙) -->
    <path d="M 300 100 A 160 160 0 1 0 300 412 A 120 120 0 1 1 300 100 Z" 
          fill="url(#neonGradient)" />

    <!-- 核心订阅符号 (RSS 图标变形) -->
    <!-- 左下角的圆点 (代表播放键/节点) -->
    <circle cx="180" cy="340" r="24" fill="#121212" stroke="url(#neonGradient)" stroke-width="12" />
    
    <!-- 订阅波纹 1 -->
    <path d="M 180 280 A 60 60 0 0 1 240 340" 
          fill="none" stroke="url(#neonGradient)" stroke-width="16" stroke-linecap="round" />
    
    <!-- 订阅波纹 2 (向外扩散) -->
    <path d="M 180 220 A 120 120 0 0 1 300 340" 
          fill="none" stroke="url(#neonGradient)" stroke-width="16" stroke-linecap="round" />

    <!-- 订阅波纹 3 (最大波纹，与月亮轮廓融合) -->
    <path d="M 180 160 A 180 180 0 0 1 360 340" 
          fill="none" stroke="url(#neonGradient)" stroke-width="16" stroke-linecap="round" opacity="0.6" />
  </g>
  
  <!-- 点缀星星 -->
  <circle cx="140" cy="120" r="4" fill="#00e5ff" opacity="0.8" />
  <circle cx="400" cy="150" r="6" fill="#7c4dff" opacity="0.6" />
  <circle cx="420" cy="380" r="3" fill="#00e5ff" opacity="0.9" />
</svg>
